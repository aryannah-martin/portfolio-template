<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Contact • Aryannah</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <nav class="nav">
    <div class="nav-inner">
      <a href="index.html" class="logo">Aryannah</a>
      <div class="links">
        <a href="index.html">Home</a>
        <a href="weather.html">Weather</a>
        <a href="affirmations.html">Affirmations</a>
        <a class="active" href="contact.html">Contact</a>
      </div>
      <button id="themeToggle">🌓</button>
    </div>
  </nav>

  <main class="container form-wrapper">
    <div style="max-width:700px;margin:0 auto;">
      <h1>Contact Me</h1>
      <p class="section-sub">Have a project, question, or collab idea? Send a quick message.</p>

      <form id="contactForm">
        <label>Name<input name="name" required></label>
        <label>Email<input name="email" type="email" required></label>
        <label>Message<textarea name="message" rows="6" required></textarea></label>

        <div style="display:flex;gap:12px;align-items:center;margin-top:6px;">
          <button class="btn" type="submit">Send Message</button>
          <span id="status" style="color:var(--muted);font-size:0.95rem;"></span>
        </div>
      </form>
    </div>
  </main>

  <footer>
    <p>© 2025 Aryannah • Portfolio</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
